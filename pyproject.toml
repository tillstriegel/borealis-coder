[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "borealis-coder"
version = "0.1.3"
description = "A provider-portable, policy-first, resumable AI coding harness."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Till Striegel" }]
keywords = ["ai", "coding-agent", "agent", "mcp", "acp", "llm", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = ["prompt-toolkit>=3.0.53,<4"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "coverage>=7.6",
  "pyright>=1.1.390",
  "pytest>=8.3",
  "ruff>=0.12",
  "twine>=6.0",
]

[project.scripts]
borealis = "borealis_coder.cli:main"

[project.entry-points."borealis.tools"]
# Third-party packages can register Tool instances or factories here.

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
borealis_coder = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.coverage.run]
branch = true
source = ["borealis_coder"]

[tool.coverage.report]
show_missing = true
fail_under = 75
